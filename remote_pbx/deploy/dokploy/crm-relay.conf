worker_processes 1;
events { worker_connections 128; }
stream {
    resolver 127.0.0.11 valid=30s ipv6=off;
    map $ssl_preread_server_name $crm_router {
        campanhas.uaitelecom.com.br dokploy-traefik:443;
        default "";
    }
    server {
        listen 443;
        ssl_preread on;
        proxy_connect_timeout 3s;
        proxy_timeout 30s;
        proxy_pass $crm_router;
    }
}
