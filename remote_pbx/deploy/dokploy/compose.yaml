services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: [/etc/dokploy/pbx-validation/private/postgres.env]
    volumes: [database:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U pbx -d pbx]
      interval: 10s
      timeout: 5s
      retries: 6
  asterisk:
    image: uai-pbx-asterisk:20261113-fixes2
    pull_policy: never
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    environment: {TZ: America/Sao_Paulo}
    network_mode: host
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/dokploy/pbx-validation/data/asterisk-config:/etc/asterisk
      - runtime:/run/asterisk
      - logs:/var/log/asterisk
      - /etc/dokploy/pbx-validation/data/spool:/var/spool/asterisk
      - ast-data:/var/lib/asterisk
      - sounds:/usr/share/asterisk/sounds/custom
      - /etc/dokploy/pbx-validation/data/voicemail:/var/spool/asterisk/voicemail
      - type: volume
        source: recordings-production
        target: /var/spool/asterisk/monitor
        volume: {nocopy: true}
    healthcheck:
      test: [CMD-SHELL, "asterisk -rx 'core show version' | grep -q Asterisk"]
      interval: 15s
      timeout: 5s
      retries: 4
  web:
    image: uai-pbx-web:20261127-discador-dtmf
    pull_policy: build
    build:
      context: .
      dockerfile_inline: |
        FROM uai-pbx-web:20261127-agenda AS patch
        RUN sed '/Set(PJSIP_DTMF_MODE()=inband)/d' /opt/pbx-sip-admin/src/asterisk.js | tr -d '\r' > /tmp/asterisk.js && echo '0b7ffcb3286c55c415d73a34b98a5d4073dddef1d67bc4b34f7ec14abdb1bd40  /tmp/asterisk.js' | sha256sum -c -
        FROM uai-pbx-web:20261127-agenda
        COPY --from=patch /tmp/asterisk.js /opt/pbx-sip-admin/src/asterisk.js
    restart: unless-stopped
    init: true
    env_file: [/etc/dokploy/pbx-validation/private/web.env]
    networks: [internal]
    expose: ["3090"]
    depends_on:
      postgres: {condition: service_healthy}
      asterisk: {condition: service_healthy}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/dokploy/pbx-validation/data/app:/opt/pbx-sip-admin/data
      - /etc/dokploy/pbx-validation/data/generated:/opt/pbx-sip-admin/generated
      - /etc/dokploy/pbx-validation/data/backups:/opt/pbx-sip-admin/backups
      - /etc/dokploy/pbx-validation/data/asterisk-config:/etc/asterisk
      - runtime:/run/asterisk
      - logs:/var/log/asterisk
      - /etc/dokploy/pbx-validation/data/spool:/var/spool/asterisk
      - ast-data:/var/lib/asterisk
      - sounds:/usr/share/asterisk/sounds/custom
      - /etc/dokploy/pbx-validation/data/voicemail:/var/spool/asterisk/voicemail
      - type: volume
        source: recordings-production
        target: /var/spool/asterisk/monitor
        volume: {nocopy: true}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3090/api/me').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
  crm-relay:
    image: nginx:stable-alpine
    restart: unless-stopped
    networks:
      internal:
        aliases: [campanhas.uaitelecom.com.br]
      dokploy-network: {}
    volumes:
      - /etc/dokploy/pbx-validation/crm-relay.conf:/etc/nginx/nginx.conf:ro
    labels:
      - traefik.enable=false
  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      web: {condition: service_healthy}
    networks: [internal, dokploy-network]
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/dokploy/pbx-validation/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.pbx-sip-ws.rule=(Host(`uaipbx.uaitelecom.com.br`) || Host(`pbx-teste.131.0.112.27.sslip.io`)) && PathPrefix(`/ws`)
      - traefik.http.routers.pbx-sip-ws.entrypoints=websecure
      - traefik.http.routers.pbx-sip-ws.tls.certresolver=letsencrypt
      - traefik.http.routers.pbx-sip-ws.priority=200
      # The file-provider router takes priority when its SIP network list is available.
      - traefik.http.routers.pbx-sip-ws.service=noop@internal
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.pbx-validation.rule=Host(`pbx-teste.131.0.112.27.sslip.io`)
      - traefik.http.routers.pbx-validation.entrypoints=websecure
      - traefik.http.routers.pbx-validation.tls.certresolver=letsencrypt
      - traefik.http.routers.pbx-validation.service=pbx-validation
      - traefik.http.services.pbx-validation.loadbalancer.server.port=80
      - traefik.http.routers.pbx-production.rule=Host(`uaipbx.uaitelecom.com.br`)
      - traefik.http.routers.pbx-production.entrypoints=websecure
      - traefik.http.routers.pbx-production.tls.certresolver=letsencrypt
      - traefik.http.routers.pbx-production.service=pbx-validation
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/api/me"]
      interval: 15s
      timeout: 5s
      retries: 4
networks:
  internal:
    external: true
    name: pbx-validation-internal
  dokploy-network:
    external: true
volumes:
  database: {external: true, name: pbx-validation-db}
  runtime: {external: true, name: pbx-validation-runtime}
  logs: {external: true, name: pbx-validation-logs}
  outgoing: {external: true, name: pbx-validation-outgoing}
  outgoing-done: {external: true, name: pbx-validation-outgoing-done}
  ast-data: {external: true, name: pbx-validation-ast-data}
  sounds: {external: true, name: pbx-validation-sounds}
  recordings-production: {external: true, name: pbx-recordings-local-20261126}
